[package]
name = "protodiff"
version = "0.1.0"
edition = "2021"
description = "Diffs two .proto files for wire-breaking changes — a removed field, a changed field number or type, a removed RPC — like buf breaking (Go), no protoc or buf CLI required"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/protodiff"
readme = "README.md"
keywords = ["protobuf", "grpc", "diff", "breaking-changes", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "protodiff"
path = "src/lib.rs"

[[bin]]
name = "protodiff"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
regex = "1"
